services:
  - type: web
    name: snaplearn
    runtime: node
    repo: https://github.com/devilking7x/snaplearn
    branch: main
    plan: free
    buildCommand: npm run install:all && npm run build --prefix web
    startCommand: npm start --prefix server
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VISION_MOCK
        value: 1
      - key: PORT
        value: 10000
    staticPublishPath: web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
