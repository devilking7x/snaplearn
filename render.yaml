services:
  - type: web
    name: snaplearn
    runtime: node
    repo: https://github.com/devilking7x/snaplearn
    branch: main
    plan: free
    region: singapore
    buildCommand: npm run install:all && npm run build --prefix web
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VISION_MOCK
        value: 1
